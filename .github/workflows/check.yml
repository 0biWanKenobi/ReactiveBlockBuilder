name: Prototype checks
on:
  push:
    branches: [dev]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test scripts/custom-model.test.ts
      - run: npm run check
      - run: npm run build
      - name: Smoke test dev server
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/rbb-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ -o /tmp/rbb-page.html; then
              grep -q "Reactive Block Builder" /tmp/rbb-page.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rbb-vite.log
          exit 1
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser test nested drag handles
        run: |
          npm run dev -- --host 127.0.0.1 --port 5189 --strictPort > /tmp/rbb-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5189/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-play-mode.mjs
          node scripts/test-custom-blocks.mjs
          node scripts/test-ancestor-handles.mjs || {
            cat /tmp/rbb-browser.log
            exit 1
          }
