name: Prototype checks
on:
  push:
    branches: [dev]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test scripts/custom-model.test.ts
      - run: bun run check
      - run: bun run build
      - name: Smoke test dev server
        shell: bash
        run: |
          bun run dev --host 127.0.0.1 > /tmp/rbb-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            # SSR is disabled; rendered content is checked by the browser tests below.
            if curl --fail --silent http://127.0.0.1:5173/ -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rbb-vite.log
          exit 1
      - name: Install browser test dependencies
        run: |
          bun x playwright install --with-deps chromium
      - name: Browser test nested drag handles
        run: |
          bun run dev --host 127.0.0.1 --port 5189 --strictPort > /tmp/rbb-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5189/ > /dev/null; then break; fi
            sleep 1
          done

          if ! curl --fail --silent http://127.0.0.1:5189/ > /dev/null; then
            echo "::error::Browser test server failed to start"
            cat /tmp/rbb-browser.log
            exit 1
          fi

          for test in \
            scripts/test-play-mode.mjs \
            scripts/test-custom-blocks.mjs \
            scripts/test-ancestor-handles.mjs
          do
            echo "::group::Browser test: $test"

            if ! node "$test"; then
              echo "::endgroup::"
              echo "::error::Browser test failed: $test"
              cat /tmp/rbb-browser.log
              exit 1
            fi

            echo "::endgroup::"
          done
