name: Prototype checks
on:
  push:
    branches: [dev]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: Smoke test dev server
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/rbb-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ -o /tmp/rbb-page.html; then
              grep -q "Reactive Block Builder" /tmp/rbb-page.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rbb-vite.log
          exit 1
